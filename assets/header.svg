<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#140a2e"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .t{font-family:'Courier New',Courier,monospace;fill:#ffffff;font-weight:700;letter-spacing:1px}
      .s{font-family:'Courier New',Courier,monospace;fill:#a78bfa;font-weight:600}
      .fade{opacity:0;animation:f 1.6s ease forwards}
      .d2{animation-delay:.7s}.d3{animation-delay:1.3s}
      @keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .tw{animation:tw 2.8s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
      .tw2{animation-delay:.9s}.tw3{animation-delay:1.7s}
      .cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <g fill="#8b5cf6" opacity=".55">
    <path d="M0 240 Q150 190 300 240 T600 240 T900 240 T1200 240 V320 H0Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0 240 Q150 190 300 240 T600 240 T900 240 T1200 240 V320 H0Z;M0 240 Q150 280 300 240 T600 240 T900 240 T1200 240 V320 H0Z;M0 240 Q150 190 300 240 T600 240 T900 240 T1200 240 V320 H0Z"/>
    </path>
  </g>
  <g fill="url(#w1)" opacity=".8">
    <path d="M0 270 Q200 230 400 270 T800 270 T1200 270 V320 H0Z">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="M0 270 Q200 230 400 270 T800 270 T1200 270 V320 H0Z;M0 270 Q200 305 400 270 T800 270 T1200 270 V320 H0Z;M0 270 Q200 230 400 270 T800 270 T1200 270 V320 H0Z"/>
    </path>
  </g>
  <g fill="#a78bfa">
    <path class="tw" d="M140 70 l4 -12 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4z"/>
    <path class="tw tw2" d="M1040 60 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z"/>
    <path class="tw tw3" d="M1100 170 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z"/>
    <path class="tw tw2" d="M90 180 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z"/>
  </g>
  <circle cx="960" cy="100" r="9" fill="none" stroke="#6d28d9" stroke-width="3" class="tw"/>
  <circle cx="230" cy="140" r="7" fill="none" stroke="#6d28d9" stroke-width="3" class="tw tw3"/>
  <text x="600" y="112" text-anchor="middle" font-size="52" class="t fade">Hi, I am Abhi aka Haru</text>
  <text x="600" y="165" text-anchor="middle" font-size="28" class="s fade d2">Fullstack AI Engineer  •  Agentic Workflows</text>
  <text x="600" y="212" text-anchor="middle" font-size="20" class="s fade d3" opacity=".85">shipping AI agents at warp speed<tspan class="cur">_</tspan></text>
</svg>
